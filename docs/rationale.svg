<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="100%" style="background:#0b0f1a;border-radius:16px;font-family:ui-sans-serif,system-ui,'Segoe UI',sans-serif"><defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1b2340"/><stop offset="100%" stop-color="#141a2e"/></linearGradient>
<linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#123b2e"/><stop offset="100%" stop-color="#0d2a21"/></linearGradient>
<linearGradient id="gAmber" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4a3410"/><stop offset="100%" stop-color="#33250b"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4a1420"/><stop offset="100%" stop-color="#331018"/></linearGradient>
<linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#12304a"/><stop offset="100%" stop-color="#0d2333"/></linearGradient>
<filter id="gShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/></filter>
</defs>
<text x="32" y="46.0" font-size="20" fill="#8fd0ff" text-anchor="start" font-weight="700">設計の根拠 — 研究・論文による裏付け</text>
<text x="32" y="66.0" font-size="11.5" fill="#8fa0c0" text-anchor="start" font-weight="500">なぜこの設計になったか: 先行研究・技術の知見をどう設計判断に反映したか</text>
<rect x="30" y="78" width="430" height="32" rx="8" fill="url(#gBlue)" stroke="#3f8fd0" stroke-width="1.2"  />
<text x="245" y="100.0" font-size="14" fill="#8fd0ff" text-anchor="middle" font-weight="700">マルチエージェント設計</text>
<rect x="30" y="118" width="430" height="132" rx="12" fill="url(#g)" stroke="#3f5a8f" stroke-width="1.3"   filter="url(#gShadow)"/>
<text x="46" y="142.0" font-size="13.5" fill="#ffffff" text-anchor="start" font-weight="700">Sultan 2026</text>
<text x="46" y="164.0" font-size="10.5" fill="#9fb0cc" text-anchor="start" font-weight="500">scaffold &gt; model。同一モデルで scaffold</text>
<text x="46" y="178.175" font-size="10.5" fill="#9fb0cc" text-anchor="start" font-weight="500">変更のみで 0→49 タスク解決</text>
<text x="46" y="234.0" font-size="10.5" fill="#7fd1a8" text-anchor="start" font-weight="600">→ CLAUDE.md の指示品質を重視</text>
<text x="46" y="248.175" font-size="10.5" fill="#7fd1a8" text-anchor="start" font-weight="600">(モデル変更より指示改善を優先)</text>
<rect x="30" y="259" width="430" height="132" rx="12" fill="url(#g)" stroke="#3f5a8f" stroke-width="1.3"   filter="url(#gShadow)"/>
<text x="46" y="283.0" font-size="13.5" fill="#ffffff" text-anchor="start" font-weight="700">CHAP (NDSS 2026)</text>
<text x="46" y="305.0" font-size="10.5" fill="#9fb0cc" text-anchor="start" font-weight="500">Context Relay: 30k</text>
<text x="46" y="319.175" font-size="10.5" fill="#9fb0cc" text-anchor="start" font-weight="500">トークン超過時の構造化ハンドオフ</text>
<text x="46" y="375.0" font-size="10.5" fill="#7fd1a8" text-anchor="start" font-weight="600">→ state.py relay /</text>
<text x="46" y="389.175" font-size="10.5" fill="#7fd1a8" text-anchor="start" font-weight="600">handoff_templates.md</text>
<rect x="30" y="400" width="430" height="132" rx="12" fill="url(#g)" stroke="#3f5a8f" stroke-width="1.3"   filter="url(#gShadow)"/>
<text x="46" y="424.0" font-size="13.5" fill="#ffffff" text-anchor="start" font-weight="700">NeurIPS 2026</text>
<text x="46" y="446.0" font-size="10.5" fill="#9fb0cc" text-anchor="start" font-weight="500">同一モデル5並列で 7/9 がバイト同一出力 → 役割分化で解消</text>
<text x="46" y="516.0" font-size="10.5" fill="#7fd1a8" text-anchor="start" font-weight="600">→ 攻撃エージェントは異なるモデルを混ぜるルール</text>
<rect x="30" y="541" width="430" height="132" rx="12" fill="url(#g)" stroke="#3f5a8f" stroke-width="1.3"   filter="url(#gShadow)"/>
<text x="46" y="565.0" font-size="13.5" fill="#ffffff" text-anchor="start" font-weight="700">XBOW Mid-Year 2026</text>
<text x="46" y="587.0" font-size="10.5" fill="#9fb0cc" text-anchor="start" font-weight="500">&quot;route the right model to the</text>
<text x="46" y="601.175" font-size="10.5" fill="#9fb0cc" text-anchor="start" font-weight="500">right task&quot;</text>
<text x="46" y="657.0" font-size="10.5" fill="#7fd1a8" text-anchor="start" font-weight="600">→ 偵察は安く / 攻撃は強く (models.json で選定)</text>
<rect x="500" y="78" width="430" height="32" rx="8" fill="url(#gBlue)" stroke="#3f8fd0" stroke-width="1.2"  />
<text x="715" y="100.0" font-size="14" fill="#8fd0ff" text-anchor="middle" font-weight="700">RAG (ナレッジベース)</text>
<rect x="500" y="118" width="430" height="100" rx="12" fill="url(#g)" stroke="#2f7fa8" stroke-width="1.3"   filter="url(#gShadow)"/>
<text x="516" y="142.0" font-size="13.5" fill="#ffffff" text-anchor="start" font-weight="700">BGE-M3 (arXiv:2402.03216)</text>
<text x="516" y="164.0" font-size="10.5" fill="#9fb0cc" text-anchor="start" font-weight="500">多言語 dense embedding (日英混在対応)</text>
<text x="516" y="202.0" font-size="10.5" fill="#7fd1a8" text-anchor="start" font-weight="600">→ kb/ の embedding モデル</text>
<rect x="500" y="226" width="430" height="100" rx="12" fill="url(#g)" stroke="#2f7fa8" stroke-width="1.3"   filter="url(#gShadow)"/>
<text x="516" y="250.0" font-size="13.5" fill="#ffffff" text-anchor="start" font-weight="700">HNSW (arXiv:1603.09320)</text>
<text x="516" y="272.0" font-size="10.5" fill="#9fb0cc" text-anchor="start" font-weight="500">近似最近傍探索で大規模ベクトル検索を高速化</text>
<text x="516" y="310.0" font-size="10.5" fill="#7fd1a8" text-anchor="start" font-weight="600">→ ChromaDB 内部で使用</text>
<rect x="500" y="334" width="430" height="100" rx="12" fill="url(#g)" stroke="#2f7fa8" stroke-width="1.3"   filter="url(#gShadow)"/>
<text x="516" y="358.0" font-size="13.5" fill="#ffffff" text-anchor="start" font-weight="700">BM25</text>
<text x="516" y="380.0" font-size="10.5" fill="#9fb0cc" text-anchor="start" font-weight="500">スパース検索。&quot;SUID&quot; 等の具体トークンに強い</text>
<text x="516" y="418.0" font-size="10.5" fill="#7fd1a8" text-anchor="start" font-weight="600">→ ハイブリッド検索 (dense + sparse)</text>
<rect x="500" y="442" width="430" height="100" rx="12" fill="url(#g)" stroke="#2f7fa8" stroke-width="1.3"   filter="url(#gShadow)"/>
<text x="516" y="466.0" font-size="13.5" fill="#ffffff" text-anchor="start" font-weight="700">RRF (SIGIR 2009)</text>
<text x="516" y="488.0" font-size="10.5" fill="#9fb0cc" text-anchor="start" font-weight="500">Reciprocal Rank Fusion で</text>
<text x="516" y="502.175" font-size="10.5" fill="#9fb0cc" text-anchor="start" font-weight="500">dense/sparse を統合</text>
<text x="516" y="526.0" font-size="10.5" fill="#7fd1a8" text-anchor="start" font-weight="600">→ kb/ の検索パイプライン</text>
<rect x="500" y="550" width="430" height="100" rx="12" fill="url(#g)" stroke="#2f7fa8" stroke-width="1.3"   filter="url(#gShadow)"/>
<text x="516" y="574.0" font-size="13.5" fill="#ffffff" text-anchor="start" font-weight="700">bge-reranker-v2-m3</text>
<text x="516" y="596.0" font-size="10.5" fill="#9fb0cc" text-anchor="start" font-weight="500">クロスエンコーダーで再順位付け (nDCG +10〜20pt)</text>
<text x="516" y="634.0" font-size="10.5" fill="#7fd1a8" text-anchor="start" font-weight="600">→ kb/ のリランキング層</text></svg>